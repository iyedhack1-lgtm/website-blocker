<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة إدارة المواقع المحظورة</title>

  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 40px; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input, button { padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { background: #d9534f; color: white; border: none; cursor: pointer; }
    button:hover { background: #c9302c; }
    ul { list-style: none; padding: 0; }
    li { background: #eee; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
    .del-btn { width: auto; padding: 5px 10px; background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h2>إدارة المواقع المحظورة</h2>
    <input type="text" id="apiKey" placeholder="أدخل API Key">
    <hr>
    <h3>إضافة موقع للحظر</h3>
    <input type="text" id="domainInput" placeholder="مثال: example.com">
    <button onclick="addDomain()">حظر الدومين</button>

    <h3>المواقع المحظورة حاليًا</h3>
    <button style="background:#5bc0de" onclick="fetchList()">تحديث القائمة</button>
    <ul id="list"></ul>
  </div>

  <script>
    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'x-api-key': document.getElementById('apiKey').value
      };
    }

    async function fetchList() {
      const res = await fetch('/api/blocklist', { headers: getHeaders() });
      const data = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (data.blocked_domains) {
        data.blocked_domains.forEach(item => {
          list.innerHTML += `<li>${item.domain} <button class="del-btn" onclick="removeDomain('${item.domain}')">حذف</button></li>`;
        });
      } else {
        alert(data.error || 'فشل الجلب');
      }
    }

    async function addDomain() {
      const domain = document.getElementById('domainInput').value;
      const res = await fetch('/api/blocklist', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ domain })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.ok) fetchList();
    }

    async function removeDomain(domain) {
      const res = await fetch('/api/blocklist', {
        method: 'DELETE',
        headers: getHeaders(),
        body: JSON.stringify({ domain })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.ok) fetchList();
    }
  </script>
</body>
</html>
